name: Haftalık blog yayını
on:
  schedule:
    - cron: '23 5 * * *'   # her gün 08:23 (Türkiye saati)
  workflow_dispatch: {}
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Netlify yeniden derlesin
        run: curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
      - name: Siteyi derlemesi için bekle
        run: sleep 240
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: IndexNow bildirimi
        run: python3 weekly_indexnow.py
